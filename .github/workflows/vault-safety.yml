name: Vault safety checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run script safety tests
        run: python -m unittest discover -s 92_Scripts/tests -p "test_*.py"
      - name: Check forbidden tracked files
        shell: bash
        run: |
          forbidden="$(
            git ls-files |
            grep -E '(^|/)(__pycache__/|.*\.py[co]$|\.env($|\.)|\.obsidian/workspace(-mobile)?\.json$)' ||
            true
          )"
          if [ -n "$forbidden" ]; then
            echo "Forbidden tracked files:"
            echo "$forbidden"
            exit 1
          fi
